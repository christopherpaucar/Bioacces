<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradiente azul para el rostro -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para las ondas de voz -->
    <linearGradient id="voiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombra -->
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo blanco -->
  <rect width="100" height="100" fill="#ffffff" rx="8"/>
  
  <!-- Rostro/Ojo (representando reconocimiento facial) -->
  <!-- Contorno del rostro -->
  <circle cx="50" cy="45" r="18" fill="url(#faceGrad)" filter="url(#shadow)" opacity="0.9"/>
  
  <!-- Ojo izquierdo -->
  <ellipse cx="43" cy="42" rx="4" ry="5" fill="#ffffff"/>
  <circle cx="43" cy="42" r="2.5" fill="#1e293b"/>
  
  <!-- Ojo derecho -->
  <ellipse cx="57" cy="42" rx="4" ry="5" fill="#ffffff"/>
  <circle cx="57" cy="42" r="2.5" fill="#1e293b"/>
  
  <!-- Sonrisa -->
  <path d="M 40 50 Q 50 56, 60 50" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Ondas de sonido (representando reconocimiento de voz) -->
  <!-- Onda 1 (izquierda) -->
  <path d="M 20 70 Q 15 65, 10 70 Q 15 75, 20 70" 
        stroke="url(#voiceGrad)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Onda 2 (centro-izquierda) -->
  <path d="M 30 70 Q 25 60, 20 70 Q 25 80, 30 70" 
        stroke="url(#voiceGrad)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Onda 3 (centro-derecha) -->
  <path d="M 70 70 Q 75 60, 80 70 Q 75 80, 70 70" 
        stroke="url(#voiceGrad)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Onda 4 (derecha) -->
  <path d="M 80 70 Q 85 65, 90 70 Q 85 75, 80 70" 
        stroke="url(#voiceGrad)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Micrófono pequeño en el centro -->
  <rect x="48" y="65" width="4" height="8" rx="2" fill="url(#voiceGrad)" opacity="0.8"/>
  <line x1="50" y1="73" x2="50" y2="78" stroke="url(#voiceGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="78" x2="54" y2="78" stroke="url(#voiceGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
