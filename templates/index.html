<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BioAccess - Usuario</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="alternate icon" href="/static/favicon.ico" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.8); }
      50% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    .btn-primary {
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

<header class="top-nav">
  <button class="mode-btn active" onclick="location.href='/'">Modo Usuario</button>
  <button id="btnAdminMode" class="mode-btn" onclick="location.href='/admin-panel/'">Administrador</button>
  <h1 class="title">BioAccess</h1>
</header>

<div id="userPanel">
  <section class="box">
    <h2><span class="section-icon">✅</span> Verificar usuario</h2>
    <p style="color:#64748b;margin-bottom:1rem;">¡Hola! 👋 Para acceder, necesitamos verificar tu identidad usando reconocimiento facial y de voz.</p>
    
    <div class="camera-wrapper">
      <div class="camera-frame" style="position:relative;">
        <video id="video" autoplay playsinline style="transform: scaleX(-1);"></video>
        <img id="capturedFaceImage" style="display:none;width:100%;height:100%;object-fit:cover;transform: scaleX(-1);border-radius:8px;" />
        <div id="countdownDisplay" style="position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,0.7);z-index:10;border-radius:8px;">
          <div style="font-size:5rem;font-weight:700;color:#fff;text-shadow:3px 3px 6px rgba(0,0,0,0.8);margin-bottom:1rem;" id="countdownNumber"></div>
          <div style="font-size:1.5rem;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,0.8);" id="countdownMessage">Preparate, la verificación comenzará en...</div>
        </div>
      </div>
    </div>

    <div style="margin-top:1.5rem;text-align:center;">
      <button id="btnVerifyBoth" class="btn-primary" style="padding:15px 40px;font-size:1.1rem;font-weight:600;">🔒 Verificar identidad</button>
      <div id="voiceStatus" style="margin-top:1rem; font-size:1rem; color:#666;font-weight:500;"></div>
      <div id="stepIndicator" style="margin-top:0.8rem;padding:12px;background:#eef6ff;border:2px solid #3b82f6;border-radius:8px;display:none;">
        <div style="font-weight:700;margin-bottom:4px;color:#1e40af;font-size:1rem;" id="stepText"></div>
      </div>
    </div>
  </section>

  <section class="box">
    <h2><span class="section-icon">📊</span> Estado del sistema</h2>
    <p id="statusBox">Modo usuario activo.</p>
  </section>
</div>

<footer class="footer-bioaccess">
  <div class="footer-inner">
    <div class="footer-left">
      <span class="logo">B</span>
      <span>BioAccess — Sistema biométrico (rostro y voz)</span>
    </div>
    <div class="footer-right">made by <b>xRad0x</b></div>
  </div>
</footer>

<script src="/static/js/app_user.js"></script>
</body>
</html>
