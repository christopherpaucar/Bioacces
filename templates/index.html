<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BioAccess — Fase 3</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

<header class="top-nav">
  <button class="mode-btn active" onclick="location.href='/'">Modo Usuario</button>
  <button id="btnAdminMode" class="mode-btn" onclick="location.href='/admin-panel/'">Administrador</button>
  <h1 class="title">BioAccess</h1>
</header>

<div id="userPanel">
  <section class="box">
    <h2><span class="section-icon">✅</span> Verificar usuario</h2>
    <div class="camera-wrapper">
      <div class="camera-frame">
        <video id="video" autoplay playsinline></video>
      </div>
    </div>

    <div style="margin-top:1rem;">
      <button id="btnVerifyFace" class="btn-primary">🔒 Verificar rostro</button>
    </div>
  </section>

  <section class="box">
    <h2><span class="section-icon">📊</span> Estado del sistema</h2>
    <p id="statusBox">Modo usuario activo.</p>
  </section>
</div>

<footer class="footer-bioaccess">
  <div class="footer-inner">
    <div class="footer-left">
      <span class="logo">B</span>
      <span>BioAccess — Sistema biométrico (solo rostro)</span>
    </div>
    <div class="footer-right">made by <b>xRad0x</b></div>
  </div>
</footer>

<script src="/static/js/app_user.js"></script>
</body>
</html>
